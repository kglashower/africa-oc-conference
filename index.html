<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071f34">
<title>OneHope Africa Ops Quiz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">

  <!-- Start screen -->
  <section id="screen-start" class="screen">
    <header class="brand">
      <div class="brand-mark">OneHope</div>
      <div class="brand-sub" data-i18n="conf">Africa Operations Conference 2026</div>
    </header>
    <h1 class="title" data-i18n="title">Knowledge Check</h1>

    <div class="field">
      <label data-i18n="chooseLang">Choose your language</label>
      <div class="lang-row">
        <button type="button" class="lang-btn active" data-lang="en">English</button>
        <button type="button" class="lang-btn" data-lang="fr">Français</button>
      </div>
    </div>

    <div class="field">
      <label for="name" data-i18n="yourName">Your name</label>
      <input id="name" type="text" maxlength="24" autocomplete="name" autocapitalize="words" data-i18n-placeholder="namePh" placeholder="Type your name">
    </div>

    <div class="field">
      <label data-i18n="chooseDay">Choose a day</label>
      <div id="day-list" class="day-list"></div>
    </div>

    <p class="howto" data-i18n="howto">10 questions. 2 seconds to read, then 10 seconds to answer. The faster you answer correctly, the more points you earn.</p>

    <button id="btn-start" type="button" class="btn btn-primary" disabled data-i18n="start">Start</button>
  </section>

  <!-- Quiz screen -->
  <section id="screen-quiz" class="screen hidden">
    <div class="quiz-top">
      <div class="progress" id="progress">1 / 10</div>
      <div class="score-live"><span data-i18n="score">Score</span>: <strong id="score-live">0</strong></div>
    </div>
    <div class="timer">
      <div class="timer-bar"><div id="timer-fill" class="timer-fill"></div></div>
      <div id="timer-num" class="timer-num">10,000</div>
    </div>
    <div id="question" class="question"></div>
    <div id="answers" class="answers"></div>
    <div id="feedback" class="feedback hidden">
      <div id="feedback-text" class="feedback-text"></div>
      <button id="btn-next" type="button" class="btn btn-primary" data-i18n="next">Next</button>
    </div>
  </section>

  <!-- Final screen -->
  <section id="screen-final" class="screen hidden">
    <canvas id="confetti"></canvas>
    <div class="final-inner">
      <div class="brand-mark small">OneHope</div>
      <div class="final-label" data-i18n="finalLabel">Final score</div>
      <div id="final-name" class="final-name"></div>
      <div id="final-score" class="final-score">0</div>
      <div id="final-msg" class="final-msg"></div>
      <div id="final-stats" class="final-stats"></div>
      <div class="final-day" id="final-day"></div>
      <div class="share" data-i18n="share">📸 Take a screenshot and send it in the WhatsApp group!</div>
      <button id="btn-again" type="button" class="btn btn-ghost" data-i18n="again">Play again</button>
    </div>
  </section>

</div>

<!-- Question banks: add one script per day -->
<script src="days/day1.js"></script>
<script src="days/day2.js"></script>
<script src="app.js"></script>
</body>
</html>
